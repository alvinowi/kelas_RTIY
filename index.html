<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.big{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
h1{font-size:26px;line-height:1.2;margin:0}
h2{font-size:19px;margin:24px 0 10px}
.mute{color:var(--mute);margin:2px 0 0;font-size:13px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}

.alabel{font-size:13px;color:var(--mute);margin-right:2px}
.msg{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);margin:8px 0;font-size:14px}
.msg.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.msg.err{border-color:var(--err);color:var(--err)}
.msg.warn{border-color:var(--warn);color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.card.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}

.charts{display:grid;grid-template-columns:1fr;gap:12px}

.chart .sub{color:var(--mute);font-size:12.5px;margin:2px 0 6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--mute);font-size:11px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.chart text.val{fill:var(--ink);font-weight:600}
.chart text.pos{fill:var(--ok);font-weight:600}
.chart text.nm{fill:var(--ink);font-size:12px}
.chart .grid line,.chart .axis{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--acc);opacity:.14}
.chart .dot{fill:var(--card);stroke:var(--acc);stroke-width:2.5}
.chart .brr{fill:var(--acc)}
.chart .brr.dim{fill:var(--fill)}
.chart .row{cursor:pointer}
.chart .row:hover .brr{opacity:.8}
.chart .trk{fill:var(--tile)}
.bar{height:8px;background:var(--tile);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.big{font-size:30px;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:58px;font-size:12px;line-height:1.3}
.tile.full{border-color:var(--ok);border-width:2px}
.tile small{display:block;color:var(--mute)}
.tile b{font-weight:600}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
.hint{margin-top:18px;font-size:13px;color:var(--mute)}
.srcbar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.srcbar p{margin:0}
.filterbar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip small{color:inherit;opacity:.8}
.btn.small{padding:4px 10px;font-size:13px}
.filternote{border-color:var(--acc)}
:root[data-theme="dark"] .chip.on{color:#06222b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary,:root:not([data-theme="light"]) .chip.on{color:#06222b}}
.targetbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.targetbar select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.targetbar select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.targetbar .tdesc{flex-basis:100%}
.jmulti{position:relative}
.jbtn{padding:6px 10px}
.jpanel{position:absolute;z-index:20;top:calc(100% + 4px);left:0;width:min(440px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.jopt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;font-size:14px}
.jopt.on{border-color:var(--acc);background:var(--tile)}
.jfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.studentbar{margin:0 0 12px}
.studentbar>label{display:block;margin-bottom:4px}
.combo{position:relative;max-width:420px}
.combo input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 34px 9px 12px}
.combo input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.cbtn{position:absolute;right:2px;top:2px;bottom:2px;width:32px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:14px}
.clist{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.clist li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.clist li.hi{background:var(--tile)}
.clist li.on span{font-weight:700;color:var(--acc)}
.clist li.cnone{cursor:default;color:var(--mute)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.summary-print,.daily-print{display:none}
.noprint{}
.sumtable{table-layout:fixed}
.sumtable th,.sumtable td{white-space:normal;overflow-wrap:anywhere}
.sumtable .num{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.sumtable .pbar{display:flex;align-items:center;gap:6px}
.sumtable .pbar .bar{flex:1;margin:0}
.sumfoot{margin-top:12px;font-size:14px}
.day h1{font-size:22px}
.day h2{font-size:16px;margin:16px 0 6px}
.daydate{font-size:15px;margin:2px 0 4px}
.dayhead{display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.dayhead img{height:17mm;width:auto;display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.day h1,.daydate,.daysum{text-align:center}
.daysum{font-size:13px;color:var(--mute);margin:0 0 10px}
.daytable tr.abs td{color:var(--warn)}
.daytable tr.abs td b{color:inherit}
.daytable{table-layout:fixed;font-size:12px}
.daytable th,.daytable td{white-space:normal;overflow-wrap:anywhere;padding:6px 7px;vertical-align:top}
.daytable .num{text-align:right;white-space:nowrap}
.daytable tr.none td{color:var(--mute)}
.photos{display:grid;grid-template-columns:1fr;gap:12px}
.photos.one{grid-template-columns:1fr}
.photos figure{margin:0}
.photos img{display:block;width:100%;max-height:130mm;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#f2f2f2}
.photos figcaption{font-size:12px;color:var(--mute);margin-top:2px}
.imgfail{border:1px dashed var(--line);border-radius:6px;padding:14px;font-size:12px;color:var(--mute);margin:0}
@page{margin:14mm}
@page summary{size:A4 landscape;margin:12mm}
@page daily{size:A4 portrait;margin:.3in 12mm}
@media print{
:root:root:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#999;--tile:#e2e2e2;--ok:#0b6e8a;--fill:#9fd8e6}
.actions,.cards,.hint,.filterbar,.targetbar,.srcbar,.cmp,.studentbar{display:none}
body{background:#fff}
.bar,.bar i,.tile{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body[data-print="summary"] .wrap>:not(.summary-print){display:none}
body[data-print="summary"] .summary-print{display:block;page:summary}
body[data-print="daily"] .wrap>:not(.daily-print){display:none}
body[data-print="daily"] .daily-print{display:block;page:daily}
.noprint{display:none}
.day{break-after:page}
.day:last-child{break-after:auto}
.daily-print .tablewrap{overflow:hidden}
.photos figure{break-inside:avoid}
.summary-print .tablewrap{overflow:hidden}
.sumtable{font-size:12px}
.sumtable th,.sumtable td{padding:6px 7px}
.tablewrap{overflow:visible}
tr{break-inside:avoid}
}
@media print and (max-width:480px){
.sumtable .num{white-space:normal}
}
</style>

<script>
const SU=[["Al-Fatihah",7],["Al-Baqarah",286],["Ali 'Imran",200],["An-Nisa'",176],["Al-Ma'idah",120],["Al-An'am",165],["Al-A'raf",206],["Al-Anfal",75],["At-Taubah",129],["Yunus",109],["Hud",123],["Yusuf",111],["Ar-Ra'd",43],["Ibrahim",52],["Al-Hijr",99],["An-Nahl",128],["Al-Isra'",111],["Al-Kahf",110],["Maryam",98],["Taha",135],["Al-Anbiya'",112],["Al-Hajj",78],["Al-Mu'minun",118],["An-Nur",64],["Al-Furqan",77],["Asy-Syu'ara'",227],["An-Naml",93],["Al-Qasas",88],["Al-'Ankabut",69],["Ar-Rum",60],["Luqman",34],["As-Sajdah",30],["Al-Ahzab",73],["Saba'",54],["Fatir",45],["Yasin",83],["As-Saffat",182],["Sad",88],["Az-Zumar",75],["Ghafir",85],["Fussilat",54],["Asy-Syura",53],["Az-Zukhruf",89],["Ad-Dukhan",59],["Al-Jasiyah",37],["Al-Ahqaf",35],["Muhammad",38],["Al-Fath",29],["Al-Hujurat",18],["Qaf",45],["Az-Zariyat",60],["At-Tur",49],["An-Najm",62],["Al-Qamar",55],["Ar-Rahman",78],["Al-Waqi'ah",96],["Al-Hadid",29],["Al-Mujadilah",22],["Al-Hasyr",24],["Al-Mumtahanah",13],["As-Saff",14],["Al-Jumu'ah",11],["Al-Munafiqun",11],["At-Taghabun",18],["At-Talaq",12],["At-Tahrim",12],["Al-Mulk",30],["Al-Qalam",52],["Al-Haqqah",52],["Al-Ma'arij",44],["Nuh",28],["Al-Jinn",28],["Al-Muzzammil",20],["Al-Muddassir",56],["Al-Qiyamah",40],["Al-Insan",31],["Al-Mursalat",50],["An-Naba'",40],["An-Nazi'at",46],["'Abasa",42],["At-Takwir",29],["Al-Infitar",19],["Al-Mutaffifin",36],["Al-Insyiqaq",25],["Al-Buruj",22],["At-Tariq",17],["Al-A'la",19],["Al-Ghasyiyah",26],["Al-Fajr",30],["Al-Balad",20],["Asy-Syams",15],["Al-Lail",21],["Ad-Duha",11],["Asy-Syarh",8],["At-Tin",8],["Al-'Alaq",19],["Al-Qadr",5],["Al-Bayyinah",8],["Az-Zalzalah",8],["Al-'Adiyat",11],["Al-Qari'ah",11],["At-Takasur",8],["Al-'Asr",3],["Al-Humazah",9],["Al-Fil",5],["Quraysh",4],["Al-Ma'un",7],["Al-Kausar",3],["Al-Kafirun",6],["An-Nasr",3],["Al-Lahab",5],["Al-Ikhlas",4],["Al-Falaq",5],["An-Nas",6]].map(([name,ayat],i)=>({no:i+1,name,ayat}));
const JUZ_START=[[1, 1], [2, 142], [2, 253], [3, 93], [4, 24], [4, 148], [5, 82], [6, 111], [7, 88], [8, 41], [9, 93], [11, 6], [12, 53], [15, 1], [17, 1], [18, 75], [21, 1], [23, 1], [25, 21], [27, 56], [29, 46], [33, 31], [36, 28], [39, 32], [41, 47], [46, 1], [51, 31], [58, 1], [67, 1], [78, 1]];
const CUM=[0];SU.forEach(x=>CUM.push(CUM[CUM.length-1]+x.ayat));
const ALL_AYAT=CUM[114];
const JUZ_G=JUZ_START.map(([n,a])=>CUM[n-1]+a);
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const MAP={};SU.forEach(x=>MAP[norm(x.name)]=x);
MAP[norm('Al-Gasyiyah')]=SU[87];MAP[norm('Quraisy')]=SU[105];MAP[norm('At-Tagabun')]=SU[63];
const label=su=>su.no+'. '+su.name;
function findSurat(v){
  const t=String(v==null?'':v).trim();
  if(/^\d/.test(t)){const n=parseInt(t,10);return n>=1&&n<=114?SU[n-1]:null}
  return MAP[norm(t)]||null;
}
function juzText(a){
  const o=[];let i=0;
  while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;o.push(j>i?(j>i+1?a[i]+'-'+a[j]:a[i]+', '+a[j]):''+a[i]);i=j+1}
  return o.join(', ');
}
function buildTarget(sel){
  const all=sel==='all';
  const js=all?[...Array(30).keys()].map(k=>k+1):[...new Set(sel)].filter(j=>j>=1&&j<=30).sort((x,y)=>x-y);
  if(!js.length)js.push(30);
  const ranges={};
  js.forEach(j=>{
    const gs=JUZ_G[j-1],ge=j===30?ALL_AYAT:JUZ_G[j]-1;
    SU.forEach(x=>{const off=CUM[x.no-1],f=Math.max(1,gs-off),t=Math.min(x.ayat,ge-off);
      if(f<=t){const r=(ranges[x.no]=ranges[x.no]||[]),l=r[r.length-1];if(l&&f<=l[1]+1)l[1]=Math.max(l[1],t);else r.push([f,t])}});
  });
  const segs={};let total=0,nSeg=0,first=null,last=null;
  SU.forEach(x=>{const r=ranges[x.no];if(!r)return;
    segs[x.no]=[r[0][0],r[r.length-1][1]];nSeg++;r.forEach(([f,t])=>{total+=t-f+1});
    if(!first)first=[x,r[0][0]];last=[x,r[r.length-1][1]]});
  const contiguous=js.every((j,i)=>!i||j===js[i-1]+1);
  const name=all?"Seluruh Al-Qur'an":'Juz '+juzText(js);
  const desc=contiguous?name+': '+label(first[0])+' ayat '+first[1]+' sampai '+label(last[0])+' ayat '+last[1]+', total '+total+' ayat'
    :name+': total '+total+' ayat dalam '+nSeg+' surat';
  return {sel:all?'all':js,key:all?'semua-juz':'juz-'+juzText(js).replace(/, /g,'_'),name,title:all?name:"Al-Qur'an "+name,desc,segs,ranges,total,nSeg};
}
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;

function absKind(j){j=String(j||'');if(/sakit/i.test(j))return 'Sakit';if(/tidak\s*ada\s*kabar|tanpa\s*kabar/i.test(j))return 'Tidak ada kabar';return ''}

async function wPhoto(id){
  const urls=['https://lh3.googleusercontent.com/d/'+id+'=w1200','https://drive.google.com/thumbnail?id='+id+'&sz=w1200'];
  for(const u of urls){
    try{
      const r=await fetch(u,{mode:'cors',credentials:'omit',referrerPolicy:'no-referrer'});
      if(!r.ok)continue;
      const b=await r.blob();
      if(!/^image\//.test(b.type))continue;
      const bmp=await createImageBitmap(b);
      const sc=Math.min(1,1000/bmp.width),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
      const out=await new Promise(res=>c.toBlob(res,'image/png'));
      return {data:new Uint8Array(await out.arrayBuffer()),w:c.width,h:c.height};
    }catch(e){}
  }
  return null;
}

    chartA(){

      const mx=Math.min(100,niceCeil(Math.max(5,...t.map(p=>p.pct))));
      const y=v=>T+ih*(1-v/mx),n=t.length,step=Math.ceil(n/10);

      const line=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');

      const ticks=[0,1,2,3,4].map(k=>({v:+(mx*k/4).toFixed(1),y:y(mx*k/4)}));

      const ticks=[0,1,2,3,4].map(k=>({v:+(mx*k/4).toFixed(1),y:y(mx*k/4)}));

        const blob=await docx.Packer.toBlob(doc);
        await saveFile(await blob.arrayBuffer(),name,'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
        if(ph&&ph.total)this.note='Foto tertanam di Word: '+ph.ok+' dari '+ph.total+'.'+(ph.ok<ph.total?' Sisanya berupa link ke Google Drive karena browser tidak dapat mengunduh gambarnya.':'');
      }catch(e){
        if(e&&e.code==='declined')return;
        this.err='Gagal membuat Word: '+((e&&e.message)||e);
      }finally{this.busy=false}
    },
    async exportXlsx(kind){
      this.err='';
      try{
        const k=slug(this.tgt.key)+(this.pick.length?'-filter-tanggal':'');
        if(kind==='summary')await saveXlsx(this.wbSummary(),'ringkasan-progress-'+k+'.xlsx');
        else await saveXlsx(this.wbStudent(),'progress-'+slug(this.cur.name)+'-'+k+'.xlsx');
      }catch(e){
        if(e&&e.code==='declined')return;
        this.err='Gagal ekspor Excel: '+((e&&e.message)||e);
      }
    },
    toggle(k){this.pick=this.pick.includes(k)?this.pick.filter(x=>x!==k):[...this.pick,k]},
    async doPrint(mode){
      this.printDate=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
      document.body.dataset.print=mode;
      await this.$nextTick();
      if(mode==='daily')await this.imagesReady();
      window.print();
    },
    onFile(e){this.load(e.target.files[0]);e.target.value=''},
    onDrop(e){this.load(e.dataTransfer.files[0])},
    tileBg(t){return 'background:linear-gradient(to top,var(--fill) '+t.pct+'%,var(--tile) '+t.pct+'%)'}
